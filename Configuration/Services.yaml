services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  CmsProvenance\Provenance\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Instantiated by DataHandler through GeneralUtility::makeInstance()
  CmsProvenance\Provenance\Hook\AssignDocumentIdentifier:
    public: true

  # Instantiated by the USER content object through GeneralUtility::makeInstance()
  CmsProvenance\Provenance\Frontend\JsonLdHeaderData:
    public: true

  CmsProvenance\Provenance\Frontend\MxMetaHeaderData:
    public: true

  CmsProvenance\Provenance\Command\BackfillCommand:
    public: true

  CmsProvenance\Provenance\Command\BackfillMediaCommand:
    public: true

  # Public API for the overviews of the sub-extensions in the Provenance module
  CmsProvenance\Provenance\Backend\PageSubtree:
    public: true

  CmsProvenance\Provenance\Backend\PageOverview:
    public: true

  # Public API for the sub-extensions' well-known endpoints
  CmsProvenance\Provenance\Domain\Repository\PublicPageRepository:
    public: true

  CmsProvenance\Provenance\Domain\Repository\PageMediaRepository:
    public: true

  # Public API for the media backfill and the sub-extensions
  CmsProvenance\Provenance\Media\MediaIdentity:
    public: true

  CmsProvenance\Provenance\WellKnown\WellKnownRouter:
    arguments:
      $handlers: !tagged_iterator provenance.well_known_handler
